name: Publish Intenta to GitVerse Pages

on:
  push:
    branches: [master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "pnpm"
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @intenta/api-client build && pnpm --filter @intenta/web build
        env:
          NEXT_PUBLIC_YANDEX_API_URL: https://d5daqlniog6cb8q9t3hc.7qsg961h.apigw.yandexcloud.net
          NEXT_PUBLIC_BASE_PATH: /intenta
      - uses: gitverse/upload-pages-artifact@v1.0.0
        with:
          path: apps/web/out
          retention-days: 1

  deploy:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: gitverse/deploy-pages@v1.0.0
