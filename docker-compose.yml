services:
  postgres:
    image: postgres:17.6-alpine
    environment:
      POSTGRES_DB: intenta
      POSTGRES_USER: intenta
      POSTGRES_PASSWORD: intenta
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U intenta -d intenta"]
      interval: 2s
      timeout: 3s
      retries: 15
    volumes:
      - intenta_postgres_data:/var/lib/postgresql/data

volumes:
  intenta_postgres_data:
